query CartInput {
  cart {
    lines {
      id
      quantity
      bundleId: attribute(key: "bundle_id") {
        value
      }
      discount0: attribute(key: "discount_0") {
        value
      }
      discount1: attribute(key: "discount_1") {
        value
      }
      discount2: attribute(key: "discount_2") {
        value
      }
      qty0: attribute(key: "qty_0") {
        value
      }
      qty1: attribute(key: "qty_1") {
        value
      }
      qty2: attribute(key: "qty_2") {
        value
      }
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
